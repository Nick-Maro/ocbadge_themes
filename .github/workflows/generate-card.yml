name: Generate Card

on:
  push:
    branches: [main]
    paths:
      - gen.py
      - requirements.txt
      - data/**
      - .github/workflows/generate-card.yml
  workflow_dispatch:
    inputs:
      style:
        description: Card style
        type: choice
        default: default
        options: [default, dark, white, darkRed, hacker, oldDefault]
  schedule:
    - cron: '23 23 * * *'

permissions:
  contents: read

concurrency:
  group: card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate card
        env:
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          CARD_STYLE: ${{ inputs.style || vars.OC_STYLE || 'default' }}
        run: python gen.py "$CARD_STYLE"
      - name: Update card only when its contents change
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const content = fs.readFileSync('card.svg').toString('base64');
            let existing;
            try {
              const response = await github.rest.repos.getContent({
                owner, repo, path: 'card.svg', ref: branch
              });
              existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && existing.content.replace(/\s/g, '') === content) {
              core.info('Card is already up to date.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path: 'card.svg',
              message: 'chore: update OliCyber profile card',
              content, ...(existing ? { sha: existing.sha } : {})
            });
            core.info(`Embed: https://raw.githubusercontent.com/${owner}/${repo}/${branch}/card.svg`);
